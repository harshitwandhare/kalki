name: Release

# Push a tag like v0.3.0 to publish a GitHub Release. Notes come from the
# matching CHANGELOG.md section, so write that first.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      AUTH_SECRET: ci-only-secret-ci-only-secret-12345
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: "22"
      - name: Install bun
        run: npm install -g bun@1.3.9
      - run: bun install --frozen-lockfile
      - run: bun run db:generate

      - name: Tag matches package.json
        run: |
          v="$(node -p "require('./package.json').version")"
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != package.json v$v"; exit 1; }

      - run: bun run check
      - run: bun run build

      - name: Extract release notes
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '
            $0 ~ "^## \\[" v "\\]" { on=1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "No CHANGELOG section for $v"; exit 1; }

      - name: Source archive
        run: git archive --format=tar.gz --prefix="kalki-${GITHUB_REF_NAME}/" -o "kalki-${GITHUB_REF_NAME}.tar.gz" "$GITHUB_REF_NAME"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "Kalki $GITHUB_REF_NAME" --notes-file notes.md "kalki-${GITHUB_REF_NAME}.tar.gz"
